name: Daily YouTube Newsletter

# Run every day at 8:00 AM Beijing Time (0:00 AM UTC)
# Beijing Time is UTC+8, so 8 AM Beijing Time = 0:00 UTC
on:
  schedule:
    - cron: '0 0 * * *'  # * = every day, 0:00 UTC = 8:00 AM Beijing Time

  # Also allow manual trigger from GitHub website
  workflow_dispatch:

jobs:
  send-newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-api-python-client python-dotenv youtube-transcript-api anthropic markdown ebooklib reportlab requests

      - name: Download processed videos tracker
        uses: actions/download-artifact@v4
        with:
          name: processed-videos
          path: .
        continue-on-error: true  # First run won't have this file

      - name: Run newsletter generator
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        run: python main.py

      - name: Upload processed videos tracker
        uses: actions/upload-artifact@v4
        with:
          name: processed-videos
          path: processed_videos.json
          retention-days: 90
        if: always()  # Save even if newsletter fails
